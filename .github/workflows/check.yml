name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch changes in bob-collective/bob that the bob-gateway skills restate
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Check plugins
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/check-plugins.mjs ${BASE_REF:+--base "origin/$BASE_REF"}
      - name: Validate with the Agent Skills reference validator
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet \
            "git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"
          status=0
          for skill in plugins/*/skills/*/; do
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$skill" || status=1
          done
          exit "$status"
      - name: Validate Claude Code marketplace and plugins
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate .
          for plugin in plugins/*/; do
            npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate "$plugin"
          done
